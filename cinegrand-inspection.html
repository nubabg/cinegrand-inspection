<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cine Grand Hygiene Control</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap");

      :root {
        --bg: #06080c;
        --bg-2: #0b1016;
        --panel: #121821;
        --panel-2: #18212c;
        --panel-3: #0f141b;
        --border: #263140;
        --gold: #c8a756;
        --gold-2: #ebcb78;
        --text: #f5f7fb;
        --muted: #9ba8b9;
        --muted-2: #6d7a8c;
        --green: #2dcc70;
        --green-dark: #16784a;
        --red: #ef5b5b;
        --red-dark: #862a2a;
        --blue: #62a9ff;
        --shadow: 0 16px 40px rgba(0,0,0,.32);
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        background:
          radial-gradient(circle at top left, rgba(200,167,86,.14), transparent 24%),
          radial-gradient(circle at top right, rgba(98,169,255,.10), transparent 20%),
          linear-gradient(180deg, var(--bg) 0%, #05070a 100%);
        color: var(--text);
        font-family: "DM Sans", "Segoe UI", sans-serif;
      }

      button, input, select, textarea { font: inherit; }

      #app { position: relative; z-index: 1; }
      .app-shell { min-height: 100vh; padding: 24px; }
      .workspace { width: min(1280px, 100%); margin: 0 auto; }

      .product-strip {
        position: relative;
        display: flex; align-items: center; justify-content: center;
        gap: 16px; margin-bottom: 14px; color: var(--muted);
        min-height: 48px;
      }
      .product-strip-left {
        display: flex; align-items: center; gap: 12px;
        margin: 0 auto;
      }
      .product-strip-status {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
      }

      .brand-badge {
        width: 42px; height: 42px; border-radius: 14px;
        display: inline-flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, var(--gold), var(--gold-2));
        color: #15110b; font-family: "Oswald", sans-serif;
        font-size: 22px; font-weight: 700; letter-spacing: .08em;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.45);
      }

      .brand-meta strong {
        display: block; color: var(--text); font-family: "Oswald", sans-serif;
        font-size: 18px; letter-spacing: .08em; text-transform: uppercase;
      }
      .brand-meta span { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }

      .topbar-shell { position: sticky; top: 16px; z-index: 20; margin-bottom: 18px; }
      .topbar {
        display: flex; justify-content: space-between; align-items: center;
        gap: 16px; padding: 16px 18px;
        border: 1px solid rgba(200,167,86,.18); border-radius: 20px;
        background: linear-gradient(180deg, rgba(19,24,33,.96) 0%, rgba(10,14,20,.96) 100%);
        box-shadow: var(--shadow); backdrop-filter: blur(14px);
      }
      .topbar-nav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .topbar-meta { display: flex; gap: 10px; align-items: center; color: var(--muted); white-space: nowrap; }

      .meta-chip {
        padding: 8px 12px; border-radius: 999px;
        background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06);
        font-size: 12px;
      }

      .btn {
        border: 1px solid transparent; border-radius: 14px;
        padding: 10px 14px; cursor: pointer;
        transition: transform .16s ease, border-color .16s ease, background .16s ease;
      }
      .btn:hover, .nav-btn:hover, .status-btn:hover, .tab:hover { transform: translateY(-1px); }

      .btn-gold {
        background: linear-gradient(135deg, var(--gold), var(--gold-2));
        color: #15110b; font-weight: 700;
        border-color: rgba(0,0,0,.15);
        outline: 2px solid transparent; outline-offset: 2px;
      }
      .btn-gold:focus-visible { outline-color: var(--gold-2); }
      .btn-outline {
        background: rgba(255,255,255,.03); color: var(--text);
        border-color: rgba(255,255,255,.1);
      }
      .btn-outline:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
      .btn-green {
        background: rgba(45,204,112,.12); color: var(--green);
        border-color: rgba(45,204,112,.24);
      }
      .btn-green:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
      .btn-red {
        background: rgba(239,91,91,.12); color: var(--red);
        border-color: rgba(239,91,91,.24);
      }
      .btn-red:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
      .nav-btn {
        background: transparent; border: 1px solid transparent;
        color: var(--muted); border-radius: 12px; padding: 10px 12px;
        font-family: "Oswald", sans-serif; font-size: 14px; font-weight: 500;
        text-transform: uppercase; letter-spacing: .04em; cursor: pointer;
      }
      .nav-btn:hover { color: var(--text); background: rgba(255,255,255,.04); }
      .nav-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
      .nav-btn.state {
        color: var(--gold-2); border-color: rgba(200,167,86,.26);
        background: rgba(200,167,86,.10);
      }

      .page { padding: 8px 0 24px; }
      .grid { display: grid; gap: 16px; }
      .cards-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cards-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

      .panel {
        background: linear-gradient(180deg, rgba(24,33,44,.98) 0%, rgba(15,20,27,.98) 100%);
        border: 1px solid var(--border); border-radius: 20px;
        padding: 20px; box-shadow: var(--shadow);
      }
      .panel-soft {
        background:
          linear-gradient(135deg, rgba(200,167,86,.18), rgba(98,169,255,.08)),
          linear-gradient(180deg, rgba(24,33,44,.98), rgba(15,20,27,.98));
        border-color: rgba(200,167,86,.24);
      }

      .hero-title, .section-title {
        margin: 0 0 8px; font-family: "Oswald", sans-serif;
        letter-spacing: .04em; text-transform: uppercase;
      }
      .hero-title { font-size: 34px; }
      .section-title { font-size: 24px; }
      .muted { color: var(--muted); }
      .muted-2 { color: var(--muted-2); }

      .hero-grid {
        display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, .8fr);
        gap: 18px; align-items: stretch;
      }
      .hero-copy {
        display: flex; flex-direction: column;
        justify-content: space-between; min-height: 220px;
      }
      .hero-kicker {
        color: var(--gold-2); font-family: "Oswald", sans-serif;
        font-size: 13px; letter-spacing: .18em;
        text-transform: uppercase; margin-bottom: 10px;
      }
      .hero-orbit {
        border-radius: 18px; min-height: 220px;
        background:
          radial-gradient(circle at center, rgba(235,203,120,.20), transparent 36%),
          linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
        display: flex; align-items: center; justify-content: center;
        position: relative; overflow: hidden;
      }
      .hero-orbit::before, .hero-orbit::after {
        content: ""; position: absolute; border-radius: 50%;
        border: 1px solid rgba(200,167,86,.28);
      }
      .hero-orbit::before { width: 180px; height: 180px; }
      .hero-orbit::after { width: 240px; height: 240px; opacity: .55; }

      .hero-core {
        width: 108px; height: 108px; border-radius: 28px;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, var(--gold), var(--gold-2));
        color: #17120a; font-family: "Oswald", sans-serif;
        font-size: 46px; font-weight: 700;
        box-shadow: 0 18px 40px rgba(200,167,86,.18);
      }
      .hero-metrics {
        display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px; margin-top: 18px;
      }
      .metric {
        padding: 14px; border-radius: 16px;
        background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06);
      }
      .metric-label {
        color: var(--muted); font-size: 11px;
        letter-spacing: .12em; text-transform: uppercase;
      }
      .metric-value { font-family: "Oswald", sans-serif; font-size: 26px; margin-top: 6px; }

      .stat {
        text-align: center;
        background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.015));
      }
      .stat strong {
        display: block; font-family: "Oswald", sans-serif;
        font-size: 36px; margin-top: 8px;
      }

      .card-pick { cursor: pointer; overflow: hidden; padding: 0; transition: transform .2s ease, box-shadow .2s ease; }
      .card-pick:hover { transform: translateY(-4px); box-shadow: 0 24px 48px rgba(0,0,0,.4); }

      .card-head {
        padding: 22px 22px 28px; min-height: 240px; position: relative;
        display: flex; flex-direction: column; justify-content: flex-end;
      }
      .card-text-icon {
        position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
        font-family: "Oswald", sans-serif; font-weight: 700;
        font-size: 44px; letter-spacing: .06em; text-transform: uppercase;
        background: linear-gradient(135deg, var(--gold), var(--gold-2));
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text; opacity: .32; pointer-events: none;
        line-height: 1.1; text-align: center; max-width: 160px;
      }


      .card-body {
        padding: 18px 20px 20px;
        background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01));
      }

      .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
      .tag {
        font-size: 11px; padding: 5px 9px; border-radius: 999px;
        border: 1px solid rgba(255,255,255,.08);
        color: var(--muted); background: rgba(255,255,255,.03);
      }

      .field { display: grid; gap: 8px; margin-bottom: 14px; }
      .field label {
        font-size: 11px; color: var(--muted); text-transform: uppercase;
        letter-spacing: .14em; font-family: "Oswald", sans-serif;
      }
      .field input, .field select, .field textarea {
        width: 100%; background: var(--panel-3); color: var(--text);
        border: 1px solid rgba(255,255,255,.08); border-radius: 14px;
        padding: 12px 14px;
      }
      .field input:focus, .field select:focus, .field textarea:focus {
        outline: none; border-color: rgba(200,167,86,.45);
        box-shadow: 0 0 0 3px rgba(200,167,86,.12);
      }

      .items { display: grid; gap: 10px; }
      .item-row {
        display: grid; grid-template-columns: 1fr 240px;
        gap: 16px; align-items: center;
        background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.06);
        border-left: 4px solid rgba(200,167,86,.24); border-radius: 16px;
        padding: 14px 16px; transition: background .2s ease, border-color .2s ease;
      }
      .item-row.clean { border-left-color: var(--green); background: rgba(45,204,112,.08); }
      .item-row.dirty { border-left-color: var(--red); background: rgba(239,91,91,.08); }
      .item-row.missing { border-left-color: #f59e0b; }
      .item-title { font-weight: 700; margin-bottom: 4px; }
      .status-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .status-btn {
        border: 1px solid rgba(255,255,255,.08); border-radius: 14px;
        padding: 12px 8px; cursor: pointer;
        background: rgba(255,255,255,.03); color: var(--text);
        font-family: "Oswald", sans-serif; letter-spacing: .05em;
        transition: background .15s ease, border-color .15s ease, transform .1s ease;
      }
      .status-btn:active { transform: scale(.96); }
      .status-btn.active.clean { background: linear-gradient(135deg, var(--green), var(--green-dark)); border-color: var(--green); }
      .status-btn.active.dirty { background: linear-gradient(135deg, var(--red), var(--red-dark)); border-color: var(--red); }

      .toolbar {
        display: flex; flex-wrap: wrap; justify-content: space-between;
        align-items: center; gap: 10px; margin-bottom: 18px;
      }

      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,.06); }
      th {
        color: var(--muted); font-size: 11px; text-transform: uppercase;
        letter-spacing: .16em; font-family: "Oswald", sans-serif;
      }
      tr:nth-child(even) td { background: rgba(255,255,255,.02); }

      .pill {
        display: inline-block; padding: 4px 10px;
        border-radius: 999px; font-size: 12px; font-weight: 700;
      }
      .pill.ok { color: var(--green); background: rgba(45,204,112,.15); }
      .pill.bad { color: var(--red); background: rgba(239,91,91,.15); }

      .progress { height: 6px; background: rgba(255,255,255,.04); border-radius: 999px; overflow: hidden; }
      .progress > div { height: 100%; background: linear-gradient(135deg, var(--gold), var(--gold-2)); transition: width .3s ease; }

      .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
      .tab {
        background: rgba(255,255,255,.03); color: var(--muted);
        border: 1px solid rgba(255,255,255,.08); border-radius: 999px;
        padding: 8px 12px; cursor: pointer;
        transition: background .15s ease, color .15s ease;
      }
      .tab.active { color: var(--gold-2); border-color: rgba(200,167,86,.28); background: rgba(200,167,86,.10); }

      .bars { display: grid; gap: 10px; }
      .bar-label { display: flex; justify-content: space-between; margin-bottom: 6px; gap: 10px; }
      .bar-track { height: 8px; background: rgba(255,255,255,.04); border-radius: 999px; overflow: hidden; }
      .bar-fill { height: 100%; border-radius: 999px; transition: width .4s ease; }

      .footer-bar {
        margin-top: 24px; display: flex; justify-content: space-between;
        gap: 18px; flex-wrap: wrap; align-items: center;
        color: var(--muted); padding: 16px 2px 0;
      }
      .footer-links, .footer-icons { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; }
      .footer-icons span, .footer-links span {
        padding: 8px 10px; border-radius: 999px;
        background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06);
      }

      .modal-backdrop {
        position: fixed; inset: 0; background: rgba(0,0,0,.78);
        display: flex; align-items: center; justify-content: center;
        padding: 20px; z-index: 40;
        animation: fadeIn .2s ease;
      }
      .modal {
        width: min(520px, 100%);
        background: linear-gradient(180deg, rgba(24,33,44,.98) 0%, rgba(15,20,27,.98) 100%);
        border: 1px solid rgba(255,255,255,.08); border-radius: 20px;
        padding: 24px; box-shadow: var(--shadow);
        animation: slideUp .25s ease;
      }
      .toast {
        position: fixed; right: 20px; bottom: 20px; z-index: 50;
        padding: 14px 16px; border-radius: 16px; color: var(--text);
        border: 1px solid transparent; box-shadow: var(--shadow);
        animation: slideIn .3s ease;
      }
      .toast.success { background: rgba(22,101,52,.95); border-color: var(--green); }
      .toast.error { background: rgba(127,29,29,.95); border-color: var(--red); }

      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes slideIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes liveBlink { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(45,204,112,.6); } 50% { opacity: .6; box-shadow: 0 0 8px 2px rgba(45,204,112,.8); } }
      .live-dot {
        display: inline-block; width: 8px; height: 8px; border-radius: 50%;
        background: var(--green); margin-right: 6px; vertical-align: middle;
        animation: liveBlink 1.5s ease-in-out infinite;
      }

      /* Декоративна метла в background – не пречи на кликове */
      .broom-fun {
        position: fixed; bottom: 0; left: 0; right: 0;
        height: 80px; z-index: 0; pointer-events: none;
        overflow: hidden;
      }
      .broom-sweep {
        position: absolute; bottom: 12px; left: -60px;
        font-size: 42px; opacity: .35;
        animation: sweepAcross 18s ease-in-out infinite;
      }
      .broom-dust {
        position: absolute; bottom: 24px; width: 6px; height: 6px;
        border-radius: 50%; background: rgba(255,255,255,.25);
        pointer-events: none;
      }
      .broom-dust:nth-child(1) { left: 8%; animation: dustFade 18s ease-in-out infinite 0s; }
      .broom-dust:nth-child(2) { left: 22%; animation: dustFade 18s ease-in-out infinite 1.5s; }
      .broom-dust:nth-child(3) { left: 38%; animation: dustFade 18s ease-in-out infinite 3s; }
      .broom-dust:nth-child(4) { left: 55%; animation: dustFade 18s ease-in-out infinite 4.5s; }
      .broom-dust:nth-child(5) { left: 72%; animation: dustFade 18s ease-in-out infinite 6s; }
      .broom-dust:nth-child(6) { left: 88%; animation: dustFade 18s ease-in-out infinite 7.5s; }
      @keyframes sweepAcross {
        0%, 100% { transform: translateX(0) rotate(-5deg); }
        25% { transform: translateX(25vw) rotate(2deg); }
        50% { transform: translateX(50vw) rotate(-3deg); }
        75% { transform: translateX(75vw) rotate(2deg); }
        100% { transform: translateX(100vw) translateX(60px) rotate(-5deg); }
      }
      @keyframes dustFade {
        0%, 10%, 90%, 100% { opacity: 0; transform: scale(0.8); }
        25%, 50%, 75% { opacity: .4; transform: scale(1); }
      }

      @media (max-width: 980px) {
        .hero-grid, .cards-2, .cards-4, .cg-chart-grid { grid-template-columns: 1fr; }
        .topbar { flex-direction: column; align-items: stretch; }
        .topbar-meta { justify-content: flex-start; flex-wrap: wrap; }
        .product-strip {
          flex-direction: column;
          justify-content: center;
          text-align: center;
          gap: 10px;
        }
        .product-strip-left { justify-content: center; }
        .product-strip-status {
          position: static;
          transform: none;
        }
      }
      @media (max-width: 900px) {
        .item-row { grid-template-columns: 1fr; }
      }
      @media print {
        .app-shell, .broom-fun { display: none !important; }
        #qr-modal-backdrop { position: static !important; background: #fff !important; padding: 20px !important; width: 100% !important; min-height: 100vh !important; }
        .qr-modal { box-shadow: none !important; border: 1px solid #ddd !important; max-width: 100% !important; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="broom-fun" aria-hidden="true">
      <span class="broom-dust"></span><span class="broom-dust"></span><span class="broom-dust"></span>
      <span class="broom-dust"></span><span class="broom-dust"></span><span class="broom-dust"></span>
      <span class="broom-sweep">🧹</span>
    </div>
    <script>

      /* ── Constants ── */
      const HALLS = ["Зала 1", "Зала 2", "Зала 3", "Зала 4", "Зала 5", "Зала 6"];
      const BATHROOMS = [
        "Дамска тоалетна - Партер",
        "Мъжка тоалетна - Партер",
        "Дамска тоалетна - Етаж 1",
        "Мъжка тоалетна - Етаж 1",
        "Персонална тоалетна",
      ];

      const HALL_ITEMS = [
        { id: "cup_holders", label: "Cup Holders", icon: "☕", desc: "Поставки за чаши" },
        { id: "seats", label: "Седалки", icon: "💺", desc: "Тапицерия и механизъм" },
        { id: "carpet", label: "Мокет", icon: "🟫", desc: "Под и пътеки" },
        { id: "armrests", label: "Подлакътници", icon: "✋", desc: "Повърхности" },
        { id: "floor", label: "Под (без мокет)", icon: "🧹", desc: "Твърди настилки" },
        { id: "screen_area", label: "Зона до екрана", icon: "🎬", desc: "Предна зона" },
      ];

      const BATHROOM_ITEMS = [
        { id: "trash_bins", label: "Кошчета", icon: "🗑️", desc: "Изпразване и дезинфекция" },
        { id: "general_clean", label: "Общо почистване", icon: "🧽", desc: "Всички повърхности" },
        { id: "toilet_paper", label: "Тоалетна хартия", icon: "🧻", desc: "Зареждане" },
        { id: "soap", label: "Сапун", icon: "🧴", desc: "Дозатори" },
        { id: "mirrors", label: "Огледала", icon: "🪞", desc: "Без петна" },
        { id: "floor_bathroom", label: "Под", icon: "🧹", desc: "Мокро почистване" },
        { id: "sinks", label: "Мивки", icon: "🚿", desc: "Кран и мивка" },
      ];

      const STATUS = { CLEAN: "clean", DIRTY: "dirty" };
      const DELETE_PASSWORD = "CineGrand2025";
      const STORAGE_KEYS = { qrBaseUrl: "cg_qr_base_url", sheetsUrl: "cg_sheets_url" };

      /* ══════════════════════════════════════════════════
         ВАЖНО: Замени URL-то по-долу с твоето Web App URL
         след като deploy-неш Google Apps Script-а.
         Виж инструкциите в документа за настройка.
         ══════════════════════════════════════════════════ */
      const SHEETS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwqOpU1wZ_k8I7aXgDHcsV2_UroQrTg13R0zQnOQUrwso3H6jDd1GUykW75-OViIAUPSQ/exec";

      function getSheetsUrl() {
        return (localStorage.getItem(STORAGE_KEYS.sheetsUrl) || "").trim();
      }

      const QR_DEFAULT_URL = "https://nubabg.github.io/cinegrand-inspection/cinegrand-inspection.html";

      /* Само тези локации се показват в QR модала */
      const QR_LOCATIONS = [
        ...HALLS.map((loc) => ({ type: "hall", location: loc, icon: "🎬" })),
        { type: "bathroom", location: "Дамска тоалетна - Партер", icon: "🚿" },
        { type: "bathroom", location: "Мъжка тоалетна - Партер", icon: "🚿" },
      ];

      const CONFIGS = {
        hall: {
          title: "Проверка на Кинозала",

          locations: HALLS,
          items: HALL_ITEMS,

        bathroom: {
          title: "Проверка на Санитарен Възел",
          shortTitle: "Санитарен Възел",
          sectionTitle: "Елементи на Санитарния Възел",
          accent: "var(--blue)",
          locations: BATHROOMS,
          items: BATHROOM_ITEMS,
          tags: ["Кошчета", "Почистване", "Хартия", "Сапун", "Мивки", "Огледала"],
        },
      };

      /* ── State ── */
      const state = {
        screen: "home",
        inspectionType: "hall",
        location: HALLS[0],
        inspector: "",
        itemState: {},
        records: [],
        syncHistory: {},
        showValidation: false,
        showDeleteModal: false,
        showQRModal: false,
        deletePass: "",
        deleteErr: "",
        showPassword: false,
        toast: null,
        openedFromQR: false,
      };


      /* ── Toast timer (clean, no property on function) ── */
      let toastTimer = null;

      /* ── Helpers ── */
      const app = document.getElementById("app");

      function isMobile() {
        if (typeof navigator === "undefined") return false;
        const ua = navigator.userAgent || "";
        return /Mobi|Android|iPhone|iPad|iPod/i.test(ua);
      }

      function getConfig(type) { return CONFIGS[type] || CONFIGS.hall; }

      function fmt(iso) {
        return new Date(iso).toLocaleString("bg-BG", {
          day: "2-digit", month: "2-digit", year: "numeric",
          hour: "2-digit", minute: "2-digit",
        });
      }

      function isFilled(v) { return v === STATUS.CLEAN || v === STATUS.DIRTY; }
      function dirtyItems(record) { return record.items.filter((i) => i.status === STATUS.DIRTY); }

      function escapeHtml(v) {
        return String(v || "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }


      function showToast(msg, type = "success") {
        state.toast = { msg, type };
        render();
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { state.toast = null; render(); }, 4000);
      }

      /* ── Google Sheets Sync ── */
      function isSheetsConfigured() {
        return SHEETS_WEB_APP_URL && SHEETS_WEB_APP_URL !== "???????_????_WEB_APP_URL_???" && SHEETS_WEB_APP_URL.startsWith("https://");
      }

      function buildSheetsPayload(record) {
        const issues = dirtyItems(record);
        const config = getConfig(record.type);
        const status = issues.length ? "\u041c\u0420\u042a\u0421\u041d\u0410" : "\u0427\u0418\u0421\u0422\u0410";
        const typeLabel = config.shortTitle + " - " + record.location;
        const issueLabel = issues.length ? issues.map((item) => item.label).join(", ") : "";

        return {
          entry_id: String(record.id),
          inspected_at: fmt(record.timestamp),
          inspection_type: typeLabel,
          inspector: record.inspector,
          status,
          issues: issueLabel,
          row_values: JSON.stringify([
            record.id,
            fmt(record.timestamp),
            typeLabel,
            record.inspector,
            status,
            issueLabel,
          ]),
          record_json: JSON.stringify(record),
        };
      }

      async function sendToSheets(record) {
        if (!isSheetsConfigured()) return { success: false, error: "Sheets URL \u043d\u0435 \u0435 \u043a\u043e\u043d\u0444\u0438\u0433\u0443\u0440\u0438\u0440\u0430\u043d" };
        const payload = JSON.stringify({ record });

        try {
          const response = await fetch(SHEETS_WEB_APP_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=UTF-8" },
            body: payload,
          });
          if (!response.ok) return { success: false, error: "HTTP " + response.status };
          return { success: true, verified: true };
        } catch (err) {
          try {
            await fetch(SHEETS_WEB_APP_URL, {
              method: "POST",
              mode: "no-cors",
              body: payload,
            });
            return { success: true, verified: false };
          } catch (fallbackErr) {
            return { success: false, error: fallbackErr.message || err.message };
          }
        }
      }


      function getQRBaseUrl() {
        const saved = (localStorage.getItem(STORAGE_KEYS.qrBaseUrl) || "").trim();
        if (saved && saved.startsWith("http") && saved.length > 40) return saved.replace(/\/$/, "");
        if (typeof window !== "undefined" && window.location && window.location.href) {
          const href = window.location.href;
          if (href.startsWith("http") && (href.includes("github.io") || href.includes("vercel.app") || href.includes("netlify.app"))) {
            return href.split("?")[0].split("#")[0].replace(/\/$/, "");
          }
        }
        return QR_DEFAULT_URL;
      }

      function startInspection(type, locationOverride) {
        const config = getConfig(type);
        const loc = locationOverride && config.locations.includes(locationOverride) ? locationOverride : config.locations[0];
        Object.assign(state, {
          inspectionType: type,
          location: loc,
          inspector: "",
          itemState: {},
          showValidation: false,
          screen: "inspection",
        });
        render();
      }

      async function submitInspection() {
        const config = getConfig(state.inspectionType);
        state.showValidation = true;
        const allFilled = config.items.every((i) => isFilled(state.itemState[i.id]));
        if (!state.inspector.trim()) { showToast("Моля въведи своето пълно име.", "error"); return; }
        if (!allFilled) { showToast("Всички точки трябва да бъдат попълнени.", "error"); render(); return; }

        const record = {
          id: Date.now(),
          type: state.inspectionType,
          location: state.location,
          inspector: state.inspector.trim(),
          timestamp: new Date().toISOString(),
          items: config.items.map((i) => ({ id: i.id, label: i.label, icon: i.icon, status: state.itemState[i.id] })),
        };
        state.records = [record, ...state.records];
        showToast("Изпращане към Google Sheets…");
        const syncResult = await sendToSheets(record);
        if (syncResult.success) {
          showToast("✓ Проверката е записана в Google Sheets.");
        } else {
          showToast("⚠ Грешка при изпращане към Google Sheets: " + (syncResult.error || "неизвестна грешка"), "error");
        }
        if (state.openedFromQR) {
          state.openedFromQR = false;
          setTimeout(() => { window.location.href = "https://www.google.com/"; }, 1200);
          return;
        }
        state.screen = "home";
        render();
      }

      function renderInspection() {

      function renderItemRow(item) {
        const value = state.itemState[item.id];
        const cls = value === STATUS.CLEAN ? "clean" : value === STATUS.DIRTY ? "dirty" : state.showValidation ? "missing" : "";
        return `

            <div>

              <div class="muted">${item.desc}</div>

              <button class="status-btn ${value === STATUS.DIRTY ? "active dirty" : ""}" data-action="set-item" data-id="${item.id}" data-value="dirty">✗ Нечисто</button>
            </div>

      /* ── Targeted DOM update for item status (avoids full re-render) ── */
      function updateItemRow(itemId) {
        const config = getConfig(state.inspectionType);
        const item = config.items.find((i) => i.id === itemId);
        if (!item) return;
        const row = document.querySelector(`.item-row[data-item-id="${itemId}"]`);
        if (!row) return;
        row.outerHTML = renderItemRow(item);

        /* Update progress bar & counters */
        const filledCount = config.items.filter((i) => isFilled(state.itemState[i.id])).length;
        const progress = Math.round((filledCount / config.items.length) * 100);
        const progressBar = document.querySelector(".progress > div");
        if (progressBar) progressBar.style.width = progress + "%";

      function setupModalFocusTrap() {
        const modal = document.getElementById("modal-delete");
        if (!modal) return;
        const focusable = modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        const prevActive = document.activeElement;
        if (first) first.focus();
        function onKeyDown(e) {
          if (e.key === "Escape") {
            state.showDeleteModal = false; state.deleteErr = ""; state.deletePass = ""; render();
            document.removeEventListener("keydown", onKeyDown);
            if (prevActive && prevActive.focus) prevActive.focus();
            return;
          }
          if (e.key !== "Tab") return;
          if (e.shiftKey) {
            if (document.activeElement === first) { e.preventDefault(); if (last) last.focus(); }
          } else {
            if (document.activeElement === last) { e.preventDefault(); if (first) first.focus(); }
          }
        }
        document.addEventListener("keydown", onKeyDown);
      }

      function render() {
        const content =
          state.screen === "home" ? renderHome() :
          renderInspection();
        app.innerHTML = renderShell(content) + renderModals();
        bindInputs();
        if (state.showDeleteModal) setupModalFocusTrap();
      }

      function bindInputs() {
        const el = (id) => document.getElementById(id);
        const bind = (id, event, fn) => { const e = el(id); if (e) e["on" + event] = fn; };
        bind("location-select", "change", (e) => { state.location = e.target.value; });
        bind("inspector-input", "input", (e) => { state.inspector = e.target.value; });
        bind("delete-pass-input", "input", (e) => { state.deletePass = e.target.value; state.deleteErr = ""; });
      }

      /* ── Event Delegation ── */
      document.addEventListener("click", async (e) => {
        const btn = e.target.closest("[data-action]");
        if (!btn) return;
        const action = btn.dataset.action;

        /* Navigation */
        if (action === "go-home") { state.screen = "home"; render(); return; }

        /* Inspection item status — targeted update, no full re-render */
        if (action === "set-item") {
          state.itemState[btn.dataset.id] = btn.dataset.value;
          updateItemRow(btn.dataset.id);
          return;
        }

        /* Fill all items */
        if (action === "fill-all") {
          getConfig(state.inspectionType).items.forEach((i) => { state.itemState[i.id] = btn.dataset.value; });
          render(); return;
        }

        if (action === "submit-inspection") { await submitInspection(); return; }
        if (action === "start-inspection") { startInspection(btn.dataset.type); return; }

        /* Delete modal */
        if (action === "close-delete") { state.showDeleteModal = false; state.deleteErr = ""; state.deletePass = ""; render(); return; }
        if (action === "toggle-pass") { state.showPassword = !state.showPassword; render(); return; }
        if (action === "confirm-delete") {
          if (state.deletePass !== DELETE_PASSWORD) { state.deleteErr = "Грешна парола. Опитай отново."; render(); return; }
          state.records = [];
          Object.assign(state, { showDeleteModal: false, deletePass: "", deleteErr: "", screen: "home" });
          showToast("Сесийните данни са изчистени.");
          return;
        }

        /* QR modal */
        if (action === "open-qr") { state.showQRModal = true; render(); return; }
        if (action === "close-qr") { state.showQRModal = false; render(); return; }
        if (action === "save-qr-url") {
          const input = document.getElementById("qr-base-url-input");
          const url = (input && input.value ? input.value : "").trim();
          if (!url || !url.startsWith("http")) {
            showToast("Въведи валиден URL (започва с https:// или http://).", "error");
            return;
          }
          try {
            localStorage.setItem(STORAGE_KEYS.qrBaseUrl, url.replace(/\/$/, ""));
            showToast("URL запазен. QR кодовете вече сочат към този адрес.");
            render();
          } catch (e) {
            showToast("Грешка при запазване.", "error");
          }
          return;
        }
        if (action === "save-sheets-url") {
          const input = document.getElementById("sheets-url-input");
          const url = (input && input.value ? input.value : "").trim();
          if (!url || !url.startsWith("http")) {
            showToast("Въведи валиден Sheets URL (започва с https://).", "error");
            return;
          }
          localStorage.setItem(STORAGE_KEYS.sheetsUrl, url);
          showToast("✓ Sheets URL запазен. Бутонът е добавен в навигацията.");
          render();
          return;
        }
      });

      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        if (state.showDeleteModal) {
          state.showDeleteModal = false; state.deleteErr = ""; state.deletePass = "";
          render();
        } else if (state.showQRModal) {
          state.showQRModal = false;
          render();
        }
      });

      /* ── Initial Render: URL params за QR (отвори форма с локация) ── */
      (function initFromUrl() {
        const search = window.location.search || "";
        const hash = window.location.hash || "";
        const params = new URLSearchParams(search || (hash.startsWith("#") ? hash.slice(1) : ""));
        if (params.get("open") === "inspection") {
          const type = params.get("type");
          const loc = params.get("location");
          if ((type === "hall" || type === "bathroom") && loc) {
            state.openedFromQR = true;
            const decodedLoc = decodeURIComponent(loc.replace(/\+/g, "%20"));
            startInspection(type, decodedLoc);
            try {
              const cleanUrl = window.location.origin + window.location.pathname;
              history.replaceState({}, "", cleanUrl);
            } catch (_) {}
          }
        }
      })();
      render();
    </script>
  </body>
</html>
